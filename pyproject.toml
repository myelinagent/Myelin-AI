[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myelin-ai"
version = "1.4.0"
description = "Drop-in memory layer for AI agents — event-anchored facts, dream-synthesis consolidation, apoptosis forgetting, cite() outcome-conditioned learning, working-memory sessions, and a memory-aware multi-step agent orchestrator (OpenAI + Gemini)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Apex Insights" },
]
keywords = [
    "memory",
    "agent",
    "llm",
    "openai",
    "gemini",
    "bi-temporal",
    "knowledge-graph",
    "apoptosis",
    "consolidation",
    "rag",
    "openclaw",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = []  # zero hard deps in core; sqlite3 ships with cpython

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=2.7",
    "numpy>=1.26",
]
# CPU-only static embeddings for hybrid search (myelin.embedders.StaticEmbedder).
static = [
    "model2vec>=0.4",
    "numpy>=1.26",
]
# Runtime path for the Memory-R1 contrastive utility backend.
# Pinned across the ML-stack ABI surface so training+serving images
# stay byte-compatible (lesson from
# feedback_torch_cuda13_image_rebuild_regression.md).
contrastive = [
    "torch>=2.2,<2.6",
    "transformers>=4.40,<4.50",
    "safetensors>=0.4.3",
    "huggingface_hub>=0.23",
    "onnxruntime>=1.18",
    "numpy>=1.26",
]
# Training-only extras (heavier — needed on the Vertex training image,
# not at inference time).
training = [
    "torch>=2.2,<2.6",
    "transformers>=4.40,<4.50",
    "safetensors>=0.4.3",
    "huggingface_hub>=0.23",
    "datasets>=2.20",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "sentencepiece>=0.2",
    "onnx>=1.16",
]
test = [
    "pytest>=7",
]
# OpenAI provider for myelin.agent.OrchestratedAgent (only imported on demand).
openai = [
    "openai>=1.0",
]
# Google Gemini provider for myelin.agent.OrchestratedAgent.
google = [
    "google-genai>=0.3",
]

[project.urls]
Homepage = "https://github.com/myelinagent/Myelin-AI"
Source = "https://github.com/myelinagent/Myelin-AI"
Issues = "https://github.com/myelinagent/Myelin-AI/issues"
Changelog = "https://github.com/myelinagent/Myelin-AI/blob/main/CHANGELOG.md"

[project.scripts]
myelin-serve = "myelin.serve.sidecar:main"

[tool.hatch.build.targets.wheel]
packages = ["myelin"]

[tool.hatch.build.targets.sdist]
include = [
    "myelin/**/*.py",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
